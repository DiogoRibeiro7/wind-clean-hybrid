name: testthat

on:
  push:
    branches:
      - develop
      - main
      - "feat/**"
      - "fix/**"
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

jobs:
  testthat:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up R
        uses: DiogoRibeiro7/git-actions-collection/.github/actions/setup-r@v1
        with:
          use-public-rspm: "true"

      - name: Set up package dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::testthat
          needs: false

      - name: Install runtime packages required by sourced tests
        shell: Rscript {0}
        run: |
          install.packages(
            c("ppclust", "Metrics", "glue", "ggplot2", "dplyr", "tibble"),
            repos = "https://cloud.r-project.org"
          )

      - name: Run tests
        shell: Rscript {0}
        run: |
          testthat::test_dir("tests/testthat", reporter = "summary")

