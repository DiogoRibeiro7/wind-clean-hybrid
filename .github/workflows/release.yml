name: release-build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release-artifact:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Set up package dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck, any::devtools, any::keras
          needs: check

      - name: Build source package
        id: build-package
        shell: Rscript {0}
        run: |
          pkg_file <- devtools::build(path = tempdir(), quiet = TRUE)
          cat(sprintf("pkg_file=%s\n", pkg_file), file = Sys.getenv("GITHUB_OUTPUT"), append = TRUE)

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: r-package-tarball
          path: ${{ steps.build-package.outputs.pkg_file }}

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.build-package.outputs.pkg_file }}
