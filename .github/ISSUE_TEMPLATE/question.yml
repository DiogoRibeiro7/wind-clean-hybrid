name: Question
description: Ask for clarification about usage, behavior, or project direction.
title: "[Question]: "
labels:
  - question
body:
  - type: textarea
    id: question
    attributes:
      label: Question
      placeholder: What do you want to know?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Include any code, error output, or workflow context that would help answer the question.
      placeholder: Share the relevant background here.
    validations:
      required: false
